version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keeps the Dockerfile's base image (and its digest pin) current.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
