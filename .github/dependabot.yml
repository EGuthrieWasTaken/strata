version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keeps the Playwright that the browser tests use (tests/browser/package.json, pinned exactly)
  # current. A new Playwright can change how pages render, so it arrives as a pull request that runs
  # the `browser` job.
  - package-ecosystem: "npm"
    directory: "/tests/browser"
    schedule:
      interval: "weekly"

  # Keeps the Dockerfile's base image (and its digest pin) current. The image stays on the Python
  # minor the test matrix covers (tests/integration/test_container_files.py pins the tag), so a new
  # Python minor or major is moved to by hand, together with that matrix, and not proposed here:
  # only the digest of the pinned tag is kept current.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
