name: Docs

# Specification integrity checks: openspec:ci-gate#specification-integrity-checks. Kept as its
# own workflow per openspec:architecture#module-boundaries / openspec:ci-gate#ci-files, and
# required directly in branch protection (openspec:ci-gate#branch-protection-and-the-gate-job) since GitHub Actions `needs:`
# cannot reach across workflow files into `ci.yml`'s `gate` job.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync
      - run: uv run python scripts/check_docs.py
      # The wiki pages in wiki/: links, headings, the sidebar, the commands in examples and that the
      # generated command reference is current (openspec:project-documentation#project-wiki).
      - run: uv run python scripts/check_wiki.py
      # OpenSpec specs and change proposals (openspec/README.md). Uses the
      # runner's preinstalled Node (OpenSpec needs >= 20.19); the package
      # version is pinned so a new OpenSpec release cannot change the gate.
      - name: openspec validate
        env:
          OPENSPEC_TELEMETRY: "0"
        run: |
          node --version
          npx --yes @fission-ai/openspec@1.13.2 validate --all --strict --no-interactive
