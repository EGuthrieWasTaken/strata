name: Release

# Tag-triggered build, SBOM, and draft release: openspec:ci-gate#release-requirements.
#
# NOTE: this builds the sdist/wheel, runs the full suite, generates an SBOM,
# and creates a draft GitHub release with the artefacts attached. It does
# NOT publish to PyPI yet -- that needs a one-time PyPI Trusted Publisher
# configured for this repository (https://docs.pypi.org/trusted-publishers/)
# before a `pypi` environment and publish step can be safely added. Signed
# artefacts (Sigstore) are likewise left for that follow-up, so as not to
# pin a signing action's SHA without the publishing story it protects.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync
      - name: Configure git identity (needed by integration/e2e tests)
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Full suite must be green before a release is built
        run: uv run pytest -q -n auto
      - run: uv build
      - name: Generate a CycloneDX SBOM
        run: uvx --from cyclonedx-bom cyclonedx-py environment --output-format json --output-file sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            dist/*
            sbom.json

  draft-release:
    name: draft-release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download build artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release-artifacts
      - name: Create a draft GitHub release with the built artefacts attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-artifacts/dist/* release-artifacts/sbom.json \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --draft \
            --generate-notes

  # openspec:container-image#published-multi-architecture-image. One image per architecture, built
  # natively on its own runner and pushed with an SBOM and provenance attestation (BuildKit's own,
  # no third-party action); the manifest job joins them under the version tag and `latest`.
  # NOT done yet: cosign signing, for the same reason as the Sigstore note at the top of this file.
  container:
    name: container (${{ matrix.arch }})
    needs: build
    strategy:
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ARCH: ${{ matrix.arch }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and push the ${{ matrix.arch }} image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --name strata --driver docker-container --use
          docker buildx build --platform "linux/${ARCH}" \
            --tag "${image}:${REF_NAME#v}-${ARCH}" \
            --sbom=true --provenance=mode=max --push .

  container-manifest:
    name: container manifest
    needs: container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Publish the multi-architecture tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${REF_NAME#v}"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create \
            --tag "${image}:${version}" --tag "${image}:latest" \
            "${image}:${version}-amd64" "${image}:${version}-arm64"
          docker buildx imagetools inspect "${image}:${version}"

