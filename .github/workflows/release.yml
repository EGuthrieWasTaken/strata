name: Release

# Tag-triggered build, SBOM, and draft release: openspec:ci-gate#release-requirements.
#
# NOTE: this builds the sdist/wheel, runs the full suite, generates an SBOM,
# and creates a draft GitHub release with the artefacts attached. It does
# NOT publish to PyPI yet -- that needs a one-time PyPI Trusted Publisher
# configured for this repository (https://docs.pypi.org/trusted-publishers/)
# before a `pypi` environment and publish step can be safely added. The
# container image is signed with cosign (keyless, see `container-manifest`);
# Sigstore signatures for the Python artefacts wait for the PyPI step.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync
      - name: Configure git identity (needed by integration/e2e tests)
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Full suite must be green before a release is built
        run: uv run pytest -q -n auto
      - run: uv build
      - name: Generate a CycloneDX SBOM
        run: uvx --from cyclonedx-bom cyclonedx-py environment --output-format json --output-file sbom.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: |
            dist/*
            sbom.json

  binaries:
    name: binaries
    needs: build
    uses: ./.github/workflows/binaries.yml

  draft-release:
    name: draft-release
    needs: [build, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download build artefacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release-artifacts
      - name: Download the standalone binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: release-artifacts/binaries
          merge-multiple: true
      - name: Create a draft GitHub release with the built artefacts attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-artifacts/dist/* release-artifacts/sbom.json release-artifacts/binaries/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --draft \
            --generate-notes

  # openspec:container-image#published-multi-architecture-image. One image per architecture, built
  # natively on its own runner and pushed with an SBOM and provenance attestation (BuildKit's own,
  # no third-party action); the manifest job joins them under the version tag and `latest`.
  # The manifest job signs the multi-architecture image with cosign (keyless, by digest).
  container:
    name: container (${{ matrix.arch }})
    needs: build
    strategy:
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ARCH: ${{ matrix.arch }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and push the ${{ matrix.arch }} image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --name strata --driver docker-container --use
          docker buildx build --platform "linux/${ARCH}" \
            --tag "${image}:${REF_NAME#v}-${ARCH}" \
            --sbom=true --provenance=mode=max --push .

  container-manifest:
    name: container manifest
    needs: container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign proves the signature came from this workflow with GitHub's OIDC token.
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REF_NAME: ${{ github.ref_name }}
      # cosign, pinned by version and checked against the release's published SHA-256 (no
      # third-party action; the same rule as the rest of this workflow).
      COSIGN_VERSION: v2.5.0
      COSIGN_SHA256: 1f6c194dd0891eb345b436bb71ff9f996768355f5e0ce02dde88567029ac2188
    steps:
      - name: Publish the multi-architecture tags
        id: manifest
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${REF_NAME#v}"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create \
            --tag "${image}:${version}" --tag "${image}:latest" \
            "${image}:${version}-amd64" "${image}:${version}-arm64"
          docker buildx imagetools inspect "${image}:${version}"
          digest=$(docker buildx imagetools inspect "${image}:${version}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "ref=${image}@${digest}" >> "$GITHUB_OUTPUT"
      - name: Install cosign
        run: |
          curl -fsSL -o cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  cosign" | sha256sum --check
          sudo install -m 0755 cosign /usr/local/bin/cosign
      # openspec:container-image#published-multi-architecture-image: signed by digest, so the
      # signature covers exactly what was pushed; the tags only point at it.
      - name: Sign the image
        env:
          REF: ${{ steps.manifest.outputs.ref }}
        run: |
          echo "$GH_TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cosign sign --yes "$REF"
      - name: Check the signature as a user would
        env:
          REF: ${{ steps.manifest.outputs.ref }}
        run: |
          cosign verify "$REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"

