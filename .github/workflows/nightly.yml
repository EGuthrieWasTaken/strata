name: Nightly

# Scheduled deep checks: openspec:ci-gate#nightly-checks. These are heavier than
# the pull-request gate can afford per-push and catch a different class of
# regression (upstream drift, dependency CVEs, fuzz-found parser crashes,
# packaging breakage).
on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  metafor-live:
    name: metafor-live
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync
      # Two apt packages beyond r-base-core are needed, and --no-install-recommends hides both:
      #  - r-recommended supplies Matrix (also nlme, lattice), which metafor depends on. install.packages
      #    cannot fetch Matrix for Ubuntu's R from the mirror ("dependency 'Matrix' is not available for
      #    package 'metafor'"), so the apt copy must be present.
      #  - r-base-dev supplies libblas-dev, liblapack-dev and gfortran. Packages are built from source,
      #    and mvtnorm fails to link without the development libraries ("cannot find -llapack").
      # install.packages only warns when a package fails, so the loop below makes a failure stop this step.
      - name: Install R with the current metafor, clubSandwich and mvtnorm
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core r-base-dev r-recommended
          sudo Rscript -e '
            options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest"))
            pkgs <- c("metafor", "clubSandwich", "mvtnorm")
            install.packages(pkgs)
            failed <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
            if (length(failed)) stop("failed to install: ", paste(failed, collapse = ", "), call. = FALSE)'
          Rscript -e 'suppressMessages(library(metafor)); cat("metafor", as.character(packageVersion("metafor")), "\n")'
      - name: Regenerate statistical fixtures against current metafor
        run: STRATA_FIXTURE_DIR="$RUNNER_TEMP/fresh-fixtures" Rscript tests/statistical/generate.R
      - name: Fail when a regenerated number drifts from the committed fixture
        run: uv run python tests/statistical/compare_fixtures.py tests/statistical/fixtures "$RUNNER_TEMP/fresh-fixtures"

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync
      - name: Fuzz ingest.parsers from the fixture corpus
        run: |
          if [ -d tests/fuzz ]; then
            uv run pytest tests/fuzz -q
          else
            echo "no parsers to fuzz yet (ingest.parsers lands in M1)"
          fi

  benchmark-50k:
    name: benchmark-50k
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync
      - name: Full-scale performance targets (openspec:performance#scale-targets), blocking
        run: |
          if [ -d tests/benchmark ]; then
            uv run pytest tests/benchmark -q -m benchmark_50k
          else
            echo "no 50k benchmark yet"
          fi

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync
      - run: uv export --no-hashes --no-dev -o requirements.txt
      - run: uvx pip-audit --requirement requirements.txt

  cold-install:
    name: cold-install
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install the published artefact from scratch and run the quickstart
        run: |
          uv venv cold-install-env
          uv pip install --python cold-install-env -e .
          uv run --python cold-install-env strata --help

  # openspec:container-image: the image builds from scratch and runs the same smoke test as the
  # pull-request job, so a base-image or dependency change that breaks it is caught overnight.
  cold-install-container:
    name: cold-install-container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image without cache and run the smoke test
        run: |
          docker build --no-cache --pull --tag strata:nightly .
          scripts/container_smoke.sh strata:nightly

  open-issue-on-failure:
    name: open-issue-on-failure
    if: failure()
    needs: [metafor-live, fuzz, benchmark-50k, audit, cold-install, cold-install-container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue for the failing nightly run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -n --arg title "Nightly failed: run ${GITHUB_RUN_ID}" \
                          --arg body "Nightly run failed: ${RUN_URL}" \
                          '{title: $title, body: $body, labels: ["nightly-failure"]}')
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "${payload}"
