name: CI

# openspec:ci-gate#tiered-pull-request-gate: the pull-request gate. Trigger is `pull_request`,
# never `pull_request_target` — fork PRs must never see secrets.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  # ---- Tier 1: fast signal ------------------------------------------------

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

  test-fast:
    name: test-fast
    runs-on: ubuntu-latest
    # M2.1 grew tests/unit past what 5 minutes reliably covers on a
    # contended runner (observed ~5-7.5 min for a suite that took 2m17s
    # before; the growth is real -- 743 tests now vs. the suite this
    # budget was set for -- not a one-off fluke, since two consecutive
    # runs on the same PR both timed out at the same point). Same
    # "raise the budget, don't shrink the suite" precedent as the `test`
    # and `coverage` jobs below. M3-M6 took the unit and property tests from
    # ~1,000 to ~1,900 and a single process no longer fits in 12 minutes (the
    # first run of the whole branch hit exactly that), so they run on every
    # core (pytest-xdist) with a budget that still has room on a small runner.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync
      - run: uv run pytest tests/unit tests/property -q -n auto
        env:
          PYTHONHASHSEED: random

  # ---- Tier 2: full signal, still required to merge -----------------------

  test:
    name: test
    needs: [lint, test-fast]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    # M2 grew the suite past what 15 minutes covers on the slower
    # Windows runners specifically (ubuntu/macos finish in ~7-10 min;
    # windows was hitting this timeout mid-run, not failing on content --
    # see PR #9's gate failure). M2.1: on a contended runner the whole
    # suite measured ~2.5-3x slower across every OS (ubuntu 7-10min ->
    # 15-21min, macos ~7-10min -> 21-24min, all still content-passing,
    # not failing on assertions); Windows's own ~24-25min baseline at
    # that same factor needs real headroom above 30, not another
    # incremental bump -- raised generously rather than repeating the
    # same too-tight-by-a-few-minutes mistake `coverage` just hit. The M3-M6 suite (2,300+ tests,
    # mostly CLI and git-backed integration tests) takes 35-45 minutes on Linux and macOS and
    # 50-60 on Windows on a four-core runner, so a 60-minute budget cancelled two legs seconds
    # before the end; 90 leaves room for a slow runner. The web write screens (PR 58) took the suite
    # from about 2,300 to 2,950 tests, most of them git-backed; on one run the nine legs took 51 to
    # 80 minutes and the slowest Windows leg was cancelled by this limit. 120 leaves room again.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - name: Configure git identity (needed by integration/e2e tests)
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - run: uv run pytest -q -n auto --durations=25 --junit-xml=pytest-report.xml
        env:
          PYTHONHASHSEED: random
      - name: Upload pytest report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-report-${{ matrix.os }}-${{ matrix.python-version }}
          path: pytest-report.xml

  statistical:
    name: statistical
    needs: [lint, test-fast]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync
      - name: Run committed metafor fixture comparisons (openspec:test-suite#statistical-validation)
        run: |
          if [ -d tests/statistical ]; then
            uv run pytest tests/statistical -q
          else
            echo "no statistical fixtures yet (native stats engine lands in M4)"
          fi

  determinism:
    name: determinism
    needs: [lint, test-fast]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync
      - name: Run the fixture emitter twice under different PYTHONHASHSEED values
        run: |
          PYTHONHASHSEED=1 uv run python scripts/determinism_check.py run1.txt
          PYTHONHASHSEED=4294967295 uv run python scripts/determinism_check.py run2.txt
      - name: Byte-compare
        run: |
          if ! diff -u run1.txt run2.txt; then
            echo "::error::determinism check failed: canonical output differs across PYTHONHASHSEED"
            exit 1
          fi
      - name: Upload differing output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: determinism-diff
          path: |
            run1.txt
            run2.txt

  coverage:
    name: coverage
    needs: [lint, test-fast]
    runs-on: ubuntu-latest
    # Full suite with coverage instrumentation runs ~8-9 minutes now that
    # M2 is complete (990+ tests); the old 5-minute budget fit M1's
    # smaller suite but was cancelling this job mid-run regardless of
    # test content (see PR #9's gate failure). M2.1: a first bump to 25
    # minutes still wasn't enough -- the actual run finished all 1017
    # tests and 97.59% coverage in 25m07s, then got cancelled because the
    # *job's* 25-minute budget left no room for checkout/setup on top of
    # that (confirmed via the job log: "1017 passed... in 1507.84s
    # (0:25:07)" followed immediately by the cancellation, not a test
    # failure). Raised with real headroom this time instead of the same
    # too-tight-by-a-few-minutes mistake. The M3-M6 suite (2,300+ tests) took 34 minutes without
    # instrumentation on a four-core runner and was cancelled at 35 with it, so the budget is
    # now the same as the matrix legs' (the instrumented run took 54 minutes, so 60 was too tight).
    # It took 75 minutes on the run that added the web write screens, so it moves with them.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync
      - name: Configure git identity (needed by integration/e2e tests)
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - run: uv run pytest -q -n auto --durations=25 --cov=strata --cov-report=xml --cov-report=term-missing
      - name: Enforce global coverage floors (openspec:test-suite#test-levels-and-coverage-floors)
        run: uv run coverage report --fail-under=90
      - name: Diff coverage against base branch (openspec:test-suite#diff-coverage)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          uv run diff-cover coverage.xml \
            --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under=95

  # openspec:container-image#image-ci: build the image on both architectures (natively, one
  # runner each, so no emulation and no third-party build action) and smoke-test it. Only when
  # something the image is made of changed; a skipped job satisfies `gate`.
  container-changes:
    name: container-changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(Dockerfile|\.dockerignore|compose\.yaml|pyproject\.toml|uv\.lock|docker/|scripts/container_smoke\.sh|src/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  container:
    name: container (${{ matrix.arch }})
    needs: [container-changes]
    if: needs.container-changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint the Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile
      - name: Build the image
        run: docker build --tag strata:ci .
      - name: Smoke test --version, git, init, verify, status and serve with /healthz
        run: scripts/container_smoke.sh strata:ci
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync
      - name: The determinism fixture is byte-identical natively and in the image
        run: |
          mkdir out
          PYTHONHASHSEED=1 uv run python scripts/determinism_check.py out/native.txt
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/scripts":/scripts:ro -v "$PWD/out":/out \
            --entrypoint python strata:ci /scripts/determinism_check.py /out/container.txt
          diff -u out/native.txt out/container.txt

  # `docs` (specification integrity) lives in its own workflow, docs.yml, per
  # openspec:ci-gate#ci-files -- `needs:` cannot cross workflow files, so it
  # is not a dependency of `gate` below; branch protection requires it directly
  # instead (openspec:ci-gate#branch-protection-and-the-gate-job).

  # ---- Tier 3: advisory, never blocks the merge ---------------------------

  benchmark:
    name: benchmark
    needs: [lint, test-fast]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync
      - name: Run benchmarks at 1k/10k (openspec:performance#scale-targets), warn only
        run: |
          if [ -d tests/benchmark ]; then
            uv run pytest tests/benchmark -q --benchmark-json=benchmark.json
          else
            echo "no benchmarks yet"
          fi
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: benchmark.json
          if-no-files-found: ignore

  traceability:
    name: traceability
    needs: [lint, test-fast]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync
      - name: Requirement traceability report (openspec:test-suite#requirement-traceability), warn only
        run: uv run python scripts/traceability_report.py || true
      - name: Upload traceability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traceability-report
          path: build/traceability-report.md
          if-no-files-found: ignore

  # ---- The required check: depends on every tier-1/2 job, tolerates skips -

  gate:
    name: gate
    if: always()
    needs: [lint, test-fast, test, statistical, determinism, coverage, container]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check that every required job succeeded or was skipped
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          python3 - <<'EOF'
          import json

          with open("needs.json") as f:
              needs = json.load(f)

          bad = {
              name: info["result"]
              for name, info in needs.items()
              if info["result"] not in ("success", "skipped")
          }
          if bad:
              print("The following required jobs did not succeed:", bad)
              raise SystemExit(1)
          print("All required jobs succeeded or were skipped.")
          EOF
