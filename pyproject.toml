[project]
name = "strata-review"
version = "0.1.0"
description = "A version-controlled workbench for systematic reviews and meta-analyses"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "strata contributors" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "ruamel.yaml>=0.18",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "rispy>=0.9",
    "bibtexparser>=1.4",
    "jsonschema>=4.21",
    "rich>=13.7",
    "python-ulid>=2.2",
    "tomlkit>=0.13",
    "python-multipart>=0.0.32",
]

[project.scripts]
strata = "strata.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strata"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "pytest-benchmark>=4.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "diff-cover>=9.1",
    "types-jsonschema>=4.21",
    "httpx2>=2.13.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
# No type stubs published for this library.
module = ["rispy", "rispy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Excludes tests/benchmark: docs/spec/05-workflow-import.md §3.7's 50,000-record
# perf check is advisory-only (docs/m1-plan.md sub-objective 6) and belongs to
# ci.yml's `benchmark` job, which targets that directory explicitly -- it must
# never run as part of a bare `pytest`/`pytest -q` invocation (the "test" and
# "coverage" jobs, both blocking gates).
testpaths = [
    "tests/unit",
    "tests/integration",
    "tests/property",
    "tests/golden",
    "tests/e2e",
    "tests/statistical",
]
pythonpath = ["."]
markers = [
    "req: mark a test as covering a specification requirement id (property invariant, E2E scenario, or error code)",
    "benchmark_50k: the 50,000-record performance targets nightly.yml's benchmark-50k job runs blocking (docs/spec/14-testing.md §7)",
]

[tool.coverage.run]
source = ["src/strata"]
branch = true

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
