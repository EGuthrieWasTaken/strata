schema: spec-driven

# Project context, shown to AI assistants when they create OpenSpec artifacts.
context: |
  strata is a free (GPL-3.0-or-later), local, version-controlled workbench for
  systematic reviews and meta-analyses. It stores an entire review as plain
  text in a git repository and wraps git so reviewers who never type
  `git commit` still get versioning, provenance, and conflict-free
  collaboration. Its flagship feature is the staleness engine: change a
  screening criterion mid-review and strata computes exactly which prior
  decisions the change invalidates, and proves the rest are still valid.

  Goals: nothing is lost (G1); changing your mind is cheap and safe (G2); the
  PRISMA funnel always reconciles (G3); collaboration without git literacy
  (G4); reproducible analysis, byte for byte (G5); free, local, and yours, with
  no account, server, or telemetry (G6). Non-goals: not a search engine, a
  reference manager, a PDF repository, a statistics language, an AI screening
  product in v1, or a hosted service.

  Tech stack: Python 3.11+, uv, typer (CLI), FastAPI + Jinja2 +
  server-rendered HTML with progressive enhancement (web UI, works without
  JavaScript), pydantic, ruamel.yaml, numpy/scipy, the MCP Python SDK (read-only
  local MCP server), pytest + hypothesis, ruff, mypy --strict.

  Architecture invariants: core.fold is pure; gitio is the only module that
  invokes git; cli, web, and mcpserver contain no domain logic; stats knows
  nothing of the repository; parsers never write events. The event log is
  append-only and sharded per actor so dual screening never conflicts in git.

  Conventions:
  - Specs use RFC 2119 keywords (MUST, SHOULD, MAY). Every requirement has at
    least one scenario and must pass `openspec validate --all --strict`.
  - Identified requirements keep their ids: property invariants P1-P13,
    end-to-end scenarios E2E-01..E2E-12, and E_* error codes. Tests name them
    with `@pytest.mark.req("P10", ...)`; scripts/traceability_report.py
    collects the markers.
  - docs/spec/ holds the long-form design rationale; requirements cite their
    source section as `docs/spec/NN-name.md §X.Y`. Code comments cite those
    sections too.
  - Roadmap milestones (docs/spec/15-roadmap.md) that are not yet built are
    tracked as changes under openspec/changes/.
  - Rationale is part of the record: every mutating command requires a
    "why", and commits carry structured `Strata-` trailers.

# Per-artifact rules.
rules:
  proposal:
    - 'Name the roadmap milestone the change belongs to, if any.'
    - 'State whether the change alters identity, normalisation, canonical serialisation, the fold, or the staleness rules; if so, say whether the repository schema version must be bumped (docs/spec/02-repository-format.md §7).'
    - 'Never propose an MCP tool or other automated path that records a screening or criteria decision without a human.'
  specs:
    - 'Use MUST/SHALL for normative requirements; a requirement that is only SHOULD must be folded into a related MUST requirement.'
    - 'Keep existing requirement ids (P*, E2E-*, E_*) verbatim in requirement text, and give any new identified requirement an id when it is written.'
    - 'End each requirement with a `_Source: ..._` line citing the docs/spec section it came from, or "new in <change-name>" if it has none.'
  design:
    - 'Record rejected alternatives and the reason, as docs/spec does.'
  tasks:
    - 'Include the test work docs/spec/14-testing.md §10.2 requires for each kind of change (regression test, property cases, golden fixture, metafor fixture, determinism assertion, guardrail test, and so on).'
    - 'Include a task to update the wiki for any new or changed user-facing command, web screen, or concept.'

# Per-operation guidance.
operations:
  apply:
    guidance:
      - 'Run `uv run ruff check .`, `uv run ruff format --check .`, `uv run mypy src`, and `uv run pytest -q` before marking a task complete.'
      - 'A task that changes behaviour is not complete without a test that fails before the change.'
  archive:
    guidance:
      - 'Before archiving, confirm every requirement added by the change is named by at least one test (scripts/traceability_report.py) where it carries an id.'
